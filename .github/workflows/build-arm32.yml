name: Build ARM APKs

on:
  push:
    branches:
      - personal-main
      - arm32
      - arm32-scale50
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否同时发布或更新 GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Prepare keystore & google-services
        run: |
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "103948572019",
                "project_id": "rikkahub-app",
                "storage_bucket": "rikkahub-app.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:103948572019:android:abcdef0123456789",
                    "android_client_info": {
                      "package_name": "me.rerere.rikkahub"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "AIzaSyA0B1C2D3E4F5G6H7I8J9K0L1M2N3O4P5Q"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth_client": []
                    }
                  }
                },
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:103948572019:android:abcdef012345678a",
                    "android_client_info": {
                      "package_name": "me.rerere.rikkahub.coexist"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "AIzaSyA0B1C2D3E4F5G6H7I8J9K0L1M2N3O4P5Q"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth_client": []
                    }
                  }
                },
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:103948572019:android:abcdef012345678b",
                    "android_client_info": {
                      "package_name": "me.rerere.rikkahub.coexist.normal"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "AIzaSyA0B1C2D3E4F5G6H7I8J9K0L1M2N3O4P5Q"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }
          EOF
          fi

          # 固定沿用仓库签名；缺失时直接失败，禁止生成无法覆盖安装的随机签名。
          test -f app/release.jks || { echo "Missing release keystore"; exit 1; }
          echo "storeFile=release.jks" > local.properties
          echo "storePassword=123456" >> local.properties
          echo "keyAlias=rikkahub" >> local.properties
          echo "keyPassword=123456" >> local.properties

      - name: Build 32-bit libsimple.so (armeabi-v7a)
        run: |
          if [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "$ANDROID_NDK_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_HOME"
          else
            NDK_PATH=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          fi
          echo "Using NDK: $NDK_PATH"

          git clone --depth 1 --branch v0.7.1 https://github.com/wangfenjin/simple.git /tmp/simple-src
          cmake -S /tmp/simple-src -B /tmp/simple-build-armeabi-v7a \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="armeabi-v7a" \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TEST_EXAMPLE=OFF \
            -DBUILD_SHELL=OFF
          cmake --build /tmp/simple-build-armeabi-v7a --config Release --target simple --parallel
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          find /tmp/simple-build-armeabi-v7a -name "libsimple.so" -exec cp {} app/src/main/jniLibs/armeabi-v7a/ \;
          ls -la app/src/main/jniLibs/armeabi-v7a/libsimple.so

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew :app:testCoexistNormalDebugUnitTest --tests '*Sync*' --tests '*MemoryRepositoryTest' --tests '*ChatInputStateTest' --tests '*MarkdownUtilsTest' \
            --max-workers=2 --no-parallel -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' --stacktrace
          ./gradlew :ai:testDebugUnitTest --tests '*QuotaQueryRunnerTest' --tests '*ChatCompletionsStreamDecoderNullTest' --tests '*ModelFilterTest' \
            --max-workers=2 --no-parallel -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' --stacktrace
          ./gradlew assembleGithubRelease assembleCoexistRelease assembleCoexistNormalRelease \
            --max-workers=2 --no-parallel -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' --stacktrace

      - name: List APK outputs
        run: |
          echo "=== Official Release APKs ==="
          ls -la app/build/outputs/apk/github/release/ || true
          echo "=== Coexist (Watch 50%) Release APKs ==="
          ls -la app/build/outputs/apk/coexist/release/ || true
          echo "=== CoexistNormal (100% Scale) Release APKs ==="
          ls -la app/build/outputs/apk/coexistNormal/release/ || true

      - name: Extract app versionName
        id: app_meta
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n 1)
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Detected versionName=${VERSION_NAME}"

      - name: Verify every release APK
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          python3 tools/verify_release_apks.py --root app/build/outputs/apk --build-tools "$BUILD_TOOLS" \
            --version-code '${{ steps.app_meta.outputs.version_code }}' \
            --version-name '${{ steps.app_meta.outputs.version_name }}' --commit "$GITHUB_SHA"

      - name: Upload APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-apks-${{ steps.app_meta.outputs.version_name }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/apk/coexist/release/*.apk
            app/build/outputs/apk/coexistNormal/release/*.apk
            app/build/outputs/apk/*-manifest.json
            app/build/outputs/apk/SHA256SUMS-*.txt

      - name: Archive mapping files
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-mapping-${{ steps.app_meta.outputs.version_name }}
          if-no-files-found: error
          path: app/build/outputs/mapping/*Release/mapping.txt

      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rikkahub-test-results
          path: |
            app/build/test-results/testCoexistNormalDebugUnitTest/*.xml
            ai/build/test-results/testDebugUnitTest/*.xml

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.app_meta.outputs.version_name) }}
          name: RikkaHub ${{ steps.app_meta.outputs.version_name }} (全架构 & 双比例共存版)
          prerelease: false
          body: |
            RikkaHub ${{ steps.app_meta.outputs.version_name }} 多架构构建版本（包含官方版、手表50%共存版与正常原比例共存版，集成 Sync V2 增量同步与双副本冲突保护）。
          files: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/apk/coexist/release/*.apk
            app/build/outputs/apk/coexistNormal/release/*.apk
