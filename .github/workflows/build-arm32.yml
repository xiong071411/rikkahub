name: Build 32-bit APK

on:
  push:
    branches:
      - arm32
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Prepare keystore & google-services
        run: |
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "103948572019",
                "project_id": "rikkahub-app",
                "storage_bucket": "rikkahub-app.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:103948572019:android:abcdef0123456789",
                    "android_client_info": {
                      "package_name": "me.rerere.rikkahub"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "AIzaSyA0B1C2D3E4F5G6H7I8J9K0L1M2N3O4P5Q"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }
          EOF
          fi

          if [ ! -f app/release.jks ]; then
            keytool -genkeypair -v -keystore app/release.jks -alias rikkahub -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=RikkaHub, OU=Rikka, O=Rikka, L=City, S=State, C=CN"
          fi
          echo "storeFile=release.jks" > local.properties
          echo "storePassword=123456" >> local.properties
          echo "keyAlias=rikkahub" >> local.properties
          echo "keyPassword=123456" >> local.properties

      - name: Build 32-bit libsimple.so (armeabi-v7a)
        run: |
          if [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "$ANDROID_NDK_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_HOME"
          else
            NDK_PATH=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          fi
          echo "Using NDK: $NDK_PATH"

          git clone --depth 1 --branch v0.7.1 https://github.com/wangfenjin/simple.git /tmp/simple-src
          cmake -S /tmp/simple-src -B /tmp/simple-build-armeabi-v7a \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="armeabi-v7a" \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TEST_EXAMPLE=OFF \
            -DBUILD_SHELL=OFF
          cmake --build /tmp/simple-build-armeabi-v7a --config Release --target simple --parallel
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          find /tmp/simple-build-armeabi-v7a -name "libsimple.so" -exec cp {} app/src/main/jniLibs/armeabi-v7a/ \;
          ls -la app/src/main/jniLibs/armeabi-v7a/libsimple.so

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease --stacktrace

      - name: List APK outputs
        run: |
          ls -la app/build/outputs/apk/github/release/

      - name: Upload APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-apks
          path: app/build/outputs/apk/github/release/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/arm32'
        continue-on-error: true
        with:
          tag_name: 3.1.1-arm32
          name: "RikkaHub 3.1.1 (32-bit & 64-bit)"
          prerelease: false
          body: |
            RikkaHub 3.1.1 32位（armeabi-v7a）与多架构构建版本。
            包含专门适配 32 位设备及智能手表的 armeabi-v7a APK。
          files: |
            app/build/outputs/apk/github/release/*.apk
